  {name:"CasaPortaria",type:"jpg",url:P("casaportaria")},
  {name:"CasaCasa",type:"jpg",url:P("casacasa")},
  {name:"CasaCasaW",type:"jpg",url:P("casacasaw")},
  {name:"CasaRotula",type:"jpg",url:P("casarotula")}

// 0 = stream MJPEG direto no <img>; >0 = recarrega um quadro (/snap/) a cada N ms (mais compativel com TVs simples)
const SNAPSHOT_MS = 0;

const $ = id => document.getElementById(id);
const grid=$("grid"), viewer=$("viewer"), img=$("img"), vid=$("vid"), msg=$("msg");
let hls=null, timer=null, lastBtn=null, n=0;

function resolveUrl(u){ return SNAPSHOT_MS>0 ? u.replace("/stream/","/snap/") : u; }
function isHls(c){ return c.type ? c.type==="hls" : c.url.indexOf(".m3u8")>-1; }
function bust(u){ return u+(u.indexOf("?")>-1?"&":"?")+"_t="+(++n)+Date.now(); }

CAMS.forEach(c=>{
  const a=document.createElement("a");
  a.className="btn"; a.href=resolveUrl(c.url); a.textContent=c.name; a.tabIndex=0;
  a.addEventListener("click",e=>{e.preventDefault(); lastBtn=a; openCam(c);});
  grid.appendChild(a);
});

function openCam(c){
  const url=resolveUrl(c.url);
  viewer.style.display="block"; msg.textContent="Carregando "+c.name+"...";
  if(isHls(c)){
    img.style.display="none"; vid.style.display="block";
    if(vid.canPlayType("application/vnd.apple.mpegurl")){ vid.src=url; }
    else if(window.Hls && Hls.isSupported()){ hls=new Hls({lowLatencyMode:true}); hls.loadSource(url); hls.attachMedia(vid);
      hls.on(Hls.Events.ERROR,(e,d)=>{ if(d.fatal) msg.textContent="Erro no stream HLS"; }); }
    else { msg.textContent="Navegador sem suporte a HLS"; return; }
    vid.play&&vid.play().catch(()=>{});
    vid.onplaying=()=>{msg.textContent="";};
  } else {
    vid.style.display="none"; img.style.display="block";
    img.onload=()=>{msg.textContent="";};
    img.onerror=()=>{msg.textContent="Falha ao carregar. Se o erro for 'cleartext', verifique o Worker (chave e URL).";};
    if(SNAPSHOT_MS>0){ img.src=bust(url); timer=setInterval(()=>{img.src=bust(url);},SNAPSHOT_MS); }
    else img.src=url;
  }
}

function closeCam(){
  if(viewer.style.display!=="block") return;
  clearInterval(timer); timer=null;
  if(hls){hls.destroy(); hls=null;}
  vid.pause(); vid.removeAttribute("src"); vid.load();
  img.onerror=null; img.removeAttribute("src");
  viewer.style.display="none"; msg.textContent="";
  if(lastBtn) lastBtn.focus();
}
viewer.addEventListener("click",closeCam);
document.addEventListener("keydown",e=>{
  if([27,8,4,461,10009].indexOf(e.keyCode)>-1 || e.key==="Escape" || e.key==="GoBack"){
    if(viewer.style.display==="block"){ e.preventDefault(); closeCam(); }
  }
});
</script>
