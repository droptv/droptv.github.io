<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>HLS Fetch Test</title>
<style>
body{font-family:sans-serif;padding:20px}
.ok{color:green} .err{color:red}
</style>
</head>
<body>
<h2>HLS Fetch Test</h2>
<div id="r">Testando...</div>
<script>
async function test(){
  const el=document.getElementById('r');
  let playlistOk=false, segOk=false, msg='';
  try{
    const r=await fetch('https://droptv.com.br/play.m3u8');
    if(!r.ok) throw new Error(r.status);
    const text=await r.text();
    playlistOk=true;
    msg+='Playlist: OK<br>';
    const lines=text.split('\n').map(l=>l.trim()).filter(l=>l&&!l.startsWith('#'));
    if(!lines.length) throw new Error('Nenhum segmento');
    let seg=lines[0];
    if(!seg.startsWith('http')) seg=new URL(seg,'https://droptv.com.br/play.m3u8').href;
    const rs=await fetch(seg);
    if(!rs.ok) throw new Error(rs.status);
    segOk=true;
    msg+='Segmento: OK<br>';
  }catch(e){
    if(!playlistOk) msg+='Playlist: FALHOU ('+e.message+')<br>';
    else msg+='Segmento: FALHOU ('+e.message+')<br>';
  }
  el.innerHTML=msg+(playlistOk&&segOk?'<b class="ok">SUCESSO</b>':'<b class="err">FALHA</b>');
}
test();
</script>
</body>
</html>
